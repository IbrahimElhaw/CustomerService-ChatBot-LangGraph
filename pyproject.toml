[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopnow-support-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-ollama",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "langgraph-checkpoint-postgres"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: Tests mit echtem LLM/Embeddings (Ollama erforderlich)"]